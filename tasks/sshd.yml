---

- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
  when: ansible_facts['pkg_mgr'] == 'apt'
  tags:
    - openssh
    - install

- name: Ensure OpenSSH server package is installed
  ansible.builtin.package:
    name: openssh-server
    state: present
  tags:
    - openssh
    - install

- name: Ensure SSH privilege separation runtime directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - openssh
    - config

- name: Ensure SSH host keys exist
  ansible.builtin.command:
    cmd: ssh-keygen -A
  register: openssh_host_key_generation
  changed_when: >-
    (openssh_host_key_generation.stdout | trim | length > 0) or
    (openssh_host_key_generation.stderr | trim | length > 0)
  tags:
    - openssh
    - config

- name: Ensure SSH service is enabled and started
  ansible.builtin.service:
    name: "{{ openssh_service_name }}"
    enabled: true
    state: started
  when: ansible_facts['service_mgr'] == 'systemd'
  tags:
    - openssh
    - service

- name: Ensure SSH configuration file exists with secure permissions
  ansible.builtin.file:
    path: "{{ openssh_config_file }}"
    owner: root
    group: root
    mode: '0600'
    state: touch
    modification_time: preserve
    access_time: preserve
  tags:
    - openssh
    - config

- name: Configure SSH access control directives
  tags:
    - openssh
    - config
  block:
    - name: Configure AllowUsers
      ansible.builtin.lineinfile:
        path: "{{ openssh_config_file }}"
        regexp: '^\s*AllowUsers\s+'
        line: "AllowUsers {{ openssh_allow_users | join(' ') }}"
        insertafter: EOF
        state: present
        validate: /usr/sbin/sshd -f %s -t
      when: openssh_allow_users | length > 0
      notify: Restart sshd
      tags:
        - openssh
        - config

    - name: Remove AllowUsers when list is empty
      ansible.builtin.lineinfile:
        path: "{{ openssh_config_file }}"
        regexp: '^\s*AllowUsers\s+'
        state: absent
        validate: /usr/sbin/sshd -f %s -t
      when: openssh_allow_users | length == 0
      notify: Restart sshd
      tags:
        - openssh
        - config

    - name: Configure AllowGroups
      ansible.builtin.lineinfile:
        path: "{{ openssh_config_file }}"
        regexp: '^\s*AllowGroups\s+'
        line: "AllowGroups {{ openssh_allow_groups | join(' ') }}"
        insertafter: EOF
        state: present
        validate: /usr/sbin/sshd -f %s -t
      when: openssh_allow_groups | length > 0
      notify: Restart sshd
      tags:
        - openssh
        - config

    - name: Remove AllowGroups when list is empty
      ansible.builtin.lineinfile:
        path: "{{ openssh_config_file }}"
        regexp: '^\s*AllowGroups\s+'
        state: absent
        validate: /usr/sbin/sshd -f %s -t
      when: openssh_allow_groups | length == 0
      notify: Restart sshd
      tags:
        - openssh
        - config

    - name: Configure DenyUsers
      ansible.builtin.lineinfile:
        path: "{{ openssh_config_file }}"
        regexp: '^\s*DenyUsers\s+'
        line: "DenyUsers {{ openssh_deny_users | join(' ') }}"
        insertafter: EOF
        state: present
        validate: /usr/sbin/sshd -f %s -t
      when: openssh_deny_users | length > 0
      notify: Restart sshd
      tags:
        - openssh
        - config

    - name: Remove DenyUsers when list is empty
      ansible.builtin.lineinfile:
        path: "{{ openssh_config_file }}"
        regexp: '^\s*DenyUsers\s+'
        state: absent
        validate: /usr/sbin/sshd -f %s -t
      when: openssh_deny_users | length == 0
      notify: Restart sshd
      tags:
        - openssh
        - config

    - name: Configure DenyGroups
      ansible.builtin.lineinfile:
        path: "{{ openssh_config_file }}"
        regexp: '^\s*DenyGroups\s+'
        line: "DenyGroups {{ openssh_deny_groups | join(' ') }}"
        insertafter: EOF
        state: present
        validate: /usr/sbin/sshd -f %s -t
      when: openssh_deny_groups | length > 0
      notify: Restart sshd
      tags:
        - openssh
        - config

    - name: Remove DenyGroups when list is empty
      ansible.builtin.lineinfile:
        path: "{{ openssh_config_file }}"
        regexp: '^\s*DenyGroups\s+'
        state: absent
        validate: /usr/sbin/sshd -f %s -t
      when: openssh_deny_groups | length == 0
      notify: Restart sshd
      tags:
        - openssh
        - config

- name: Ensure private host key permissions are correct
  tags:
    - openssh
    - config
  block:
    - name: Find private SSH host keys
      ansible.builtin.find:
        paths: /etc/ssh
        file_type: file
        patterns: ssh_host_*_key
      register: ssh_host_out
      changed_when: false
      tags:
        - openssh
        - config

    - name: Set private host key permissions
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: "{{ host_keys_group }}"
        mode: "{{ host_keys_mode }}"
        state: file
        setype: sshd_key_t
        serole: object_r
        seuser: system_u
      loop: "{{ ssh_host_out.files }}"
      loop_control:
        label: "{{ item.path }}"
      tags:
        - openssh
        - config

- name: Ensure public host key permissions are correct
  tags:
    - openssh
    - config
  block:
    - name: Find public SSH host keys
      ansible.builtin.find:
        paths: /etc/ssh
        file_type: file
        patterns: ssh_host_*_key.pub
      register: ssh_hostpub_out
      changed_when: false
      tags:
        - openssh
        - config

    - name: Set public host key permissions
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: '0644'
        state: file
        setype: sshd_key_t
        serole: object_r
        seuser: system_u
      loop: "{{ ssh_hostpub_out.files }}"
      loop_control:
        label: "{{ item.path }}"
      tags:
        - openssh
        - config

- name: Configure MAC algorithms
  ansible.builtin.lineinfile:
    path: "{{ openssh_config_file }}"
    regexp: '^\s*MACs\s+'
    line: "MACs {{ openssh_macs | join(',') }}"
    insertafter: EOF
    create: false
    state: present
    validate: /usr/sbin/sshd -f %s -t
  when:
    - openssh_macs | length > 0
    - not fs_crypto_policy_installed
  notify: Restart sshd
  tags:
    - openssh
    - config

- name: Configure key exchange algorithms
  ansible.builtin.lineinfile:
    path: "{{ openssh_config_file }}"
    regexp: '^\s*KexAlgorithms\s+'
    line: "KexAlgorithms {{ openssh_kex | join(',') }}"
    insertafter: EOF
    create: false
    state: present
    validate: /usr/sbin/sshd -f %s -t
  when:
    - openssh_kex | length > 0
    - not fs_crypto_policy_installed
  notify: Restart sshd
  tags:
    - openssh
    - config

- name: Configure ciphers
  ansible.builtin.lineinfile:
    path: "{{ openssh_config_file }}"
    regexp: '^\s*Ciphers\s+'
    line: "Ciphers {{ openssh_ciphers | join(',') }}"
    insertafter: EOF
    create: false
    state: present
    validate: /usr/sbin/sshd -f %s -t
  when:
    - openssh_ciphers | length > 0
    - not fs_crypto_policy_installed
  notify: Restart sshd
  tags:
    - openssh
    - config

- name: Configure sshd settings
  ansible.builtin.lineinfile:
    path: "{{ openssh_config_file }}"
    regexp: '^\s*{{ item.name }}\s+'
    line: "{{ item.name }} {{ item.value }}"
    insertafter: EOF
    create: false
    state: present
    validate: /usr/sbin/sshd -f %s -t
  loop:
    - { name: 'Port', value: "{{ openssh_port }}" }
    - { name: 'IgnoreRhosts', value: "{{ 'yes' if openssh_ignore_rhosts else 'no' }}" }
    - { name: 'HostbasedAuthentication', value: "{{ 'yes' if openssh_host_based_authentication else 'no' }}" }
    - { name: 'PermitRootLogin', value: "{{ openssh_permit_root_login }}" }
    - { name: 'PermitEmptyPasswords', value: "{{ 'yes' if openssh_permit_empty_passwords else 'no' }}" }
    - { name: 'PermitUserEnvironment', value: "{{ 'yes' if openssh_permit_user_environment else 'no' }}" }
    - { name: 'UsePAM', value: "{{ 'yes' if openssh_use_pam else 'no' }}" }
    - { name: 'UseDNS', value: "{{ 'yes' if openssh_use_dns else 'no' }}" }
    - { name: 'LogLevel', value: "{{ openssh_log_level }}" }
    - { name: 'X11Forwarding', value: "{{ 'yes' if openssh_x11forwarding else 'no' }}" }
    - { name: 'MaxAuthTries', value: "{{ openssh_max_auth_tries }}" }
    - { name: 'ClientAliveCountMax', value: "{{ openssh_client_alive_count_max }}" }
    - { name: 'ClientAliveInterval', value: "{{ openssh_client_alive_interval }}" }
    - { name: 'LoginGraceTime', value: "{{ openssh_login_grace_time }}" }
    - { name: 'AllowTcpForwarding', value: "{{ 'yes' if openssh_allow_tcp_forwarding else 'no' }}" }
    - { name: 'Banner', value: "{{ openssh_banner }}" }
    - { name: 'MaxStartups', value: "{{ openssh_max_startups }}" }
    - { name: 'MaxSessions', value: "{{ openssh_max_sessions }}" }
    - { name: 'PasswordAuthentication', value: "{{ 'yes' if openssh_password_authentication else 'no' }}" }
    - { name: 'PermitTunnel', value: "{{ 'yes' if openssh_permit_tunnel else 'no' }}" }
  loop_control:
    label: "{{ item.name }}: {{ item.value }}"
  notify: Restart sshd
  tags:
    - openssh
    - config

- name: Configure SELinux SSH port type for custom port
  community.general.seport:
    ports: "{{ openssh_port }}"
    proto: tcp
    setype: ssh_port_t
    state: present
  when:
    - ansible_facts.get('selinux_python_present', false)
    - ansible_facts['selinux']['status'] == 'enabled'
  tags:
    - openssh
    - config

- name: Ensure system crypto policy is not overridden on Red Hat family systems
  ansible.builtin.lineinfile:
    path: /etc/sysconfig/sshd
    regexp: '^\s*(CRYPTO_POLICY\s*=.*)$'
    line: '# CRYPTO_POLICY='
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - fs_crypto_policy_installed
  notify: Restart sshd
  tags:
    - openssh
    - config

- name: Apply pending SSH handler changes
  ansible.builtin.meta: flush_handlers
  tags:
    - openssh
    - service

- name: Restore configured SSH port for subsequent tasks
  ansible.builtin.set_fact:
    ansible_port: "{{ configured_port }}"
  changed_when: false
  tags:
    - openssh
    - validate

- name: Gather facts after SSH configuration
  ansible.builtin.setup:
  tags:
    - openssh
    - validate
