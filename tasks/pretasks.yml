---
- name: Validate integer variables
  ansible.builtin.assert:
    that:
      - lookup('vars', item) is number
    quiet: true
  when: vars[item] is defined
  delegate_to: localhost
  loop:
    - openssh_port
    - openssh_max_auth_tries
    - openssh_client_alive_interval
    - openssh_client_alive_count_max
    - openssh_login_grace_time
    - openssh_max_sessions
  tags:
    - openssh
    - validate

- name: Validate boolean variables
  ansible.builtin.assert:
    that:
      - lookup('vars', item) | type_debug == 'bool'
    quiet: true
  when: vars[item] is defined
  delegate_to: localhost
  loop:
    - openssh_x11forwarding
    - openssh_allow_tcp_forwarding
    - openssh_ignore_rhosts
    - openssh_host_based_authentication
    - openssh_permit_empty_passwords
    - openssh_permit_user_environment
    - openssh_use_pam
    - openssh_use_dns
    - openssh_password_authentication
    - openssh_permit_tunnel
  tags:
    - openssh
    - validate

- name: Validate root login setting
  ansible.builtin.assert:
    that:
      - openssh_permit_root_login is defined
      - openssh_permit_root_login is string
      - openssh_permit_root_login in ['yes', 'no', 'without-password', 'prohibit-password', 'forced-commands-only']
    quiet: true
  delegate_to: localhost
  tags:
    - openssh
    - validate

- name: Validate list variables
  ansible.builtin.assert:
    that:
      - lookup('vars', item) is sequence
    quiet: true
  when: vars[item] is defined
  delegate_to: localhost
  loop:
    - openssh_allow_users
    - openssh_allow_groups
    - openssh_deny_users
    - openssh_deny_groups
    - openssh_macs
    - openssh_kex
    - openssh_ciphers
  tags:
    - openssh
    - validate

- name: Validate remaining variables
  vars:
    pathre: '(?:[/]).+'
  ansible.builtin.assert:
    that:
      - openssh_log_level is string
      - openssh_log_level in openssh_valid_log_levels
      - openssh_banner is regex(pathre)
      - openssh_max_startups is regex('^\d+:\d+:\d+$')
      - openssh_config_file is string
    quiet: true
  delegate_to: localhost
  tags:
    - openssh
    - validate

- name: Set ansible_port from role variable
  ansible.builtin.set_fact:
    ansible_port: "{{ openssh_port }}"
  changed_when: false
  tags:
    - openssh
    - validate

- name: Detect SSH port to use for the session
  ansible.builtin.import_tasks: detect_sshd_port.yml
  tags:
    - openssh
    - validate

- name: Check whether banner file exists
  ansible.builtin.stat:
    path: "{{ openssh_banner }}"
  register: openssh_banner_stat
  tags:
    - openssh
    - validate

- name: Fail when banner file is missing
  ansible.builtin.assert:
    that:
      - openssh_banner_stat.stat.exists
    fail_msg: "Banner file not found: {{ openssh_banner }}"
    quiet: true
  tags:
    - openssh
    - validate

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto
  tags:
    - openssh
    - validate

- name: Detect whether crypto-policies package is installed
  ansible.builtin.set_fact:
    fs_crypto_policy_installed: "{{ 'crypto-policies' in ansible_facts['packages'] }}"
  changed_when: false
  tags:
    - openssh
    - validate
