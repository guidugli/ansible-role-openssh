---
# OS-specific variables for openssh role.
openssh_valid_log_levels:
  - QUIET
  - FATAL
  - ERROR
  - INFO
  - VERBOSE
  - DEBUG
  - DEBUG1
  - DEBUG2
  - DEBUG3

_host_keys_group_map:
  default: root
  RedHat: ssh_keys
  Fedora: root
  Fedora-37: ssh_keys
  Fedora-36: ssh_keys
  CentOS: ssh_keys
  Rocky: ssh_keys

host_keys_group: >-
  {{
    _host_keys_group_map[
      ansible_facts['distribution'] ~ '-' ~ ansible_facts['distribution_major_version']
    ]
    | default(
        _host_keys_group_map[ansible_facts['distribution']]
        | default(_host_keys_group_map['default'])
      )
  }}

_host_keys_mode_map:
  default: '0600'
  RedHat: '0640'
  Fedora: '0600'
  Fedora-37: '0640'
  Fedora-36: '0640'
  CentOS: '0640'
  Rocky: '0640'

host_keys_mode: >-
  {{
    _host_keys_mode_map[
      ansible_facts['distribution'] ~ '-' ~ ansible_facts['distribution_major_version']
    ]
    | default(
        _host_keys_mode_map[ansible_facts['distribution']]
        | default(_host_keys_mode_map['default'])
      )
  }}

_openssh_service_name_map:
  default: sshd
  Debian: ssh
  Ubuntu: ssh

openssh_service_name: >-
  {{
    _openssh_service_name_map[
      ansible_facts['distribution'] ~ '-' ~ ansible_facts['distribution_major_version']
    ]
    | default(
        _openssh_service_name_map[ansible_facts['distribution']]
        | default(_openssh_service_name_map['default'])
      )
  }}
